<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pan-Tilt Face Tracker</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #111418;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid #2a2f36;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #d33; display: inline-block; margin-right: 8px;
  }
  #status-dot.ok { background: #3c3; }
  main {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 16px;
  }
  #stream-wrap {
    flex: 1 1 640px;
    max-width: 100%;
  }
  img#stream {
    width: 100%;
    max-width: 640px;
    height: auto;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  #metrics {
    flex: 0 0 260px;
    background: #1a1e24;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.8;
  }
  #metrics dt { color: #9aa4b2; display: inline-block; width: 110px; }
  #metrics dd { display: inline; margin: 0; font-variant-numeric: tabular-nums; }
  #metrics div { white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1><span id="status-dot"></span>Pan-Tilt Face Tracker</h1>
  <span id="backend" style="color:#9aa4b2; font-size:12px;"></span>
</header>
<main>
  <div id="stream-wrap">
    <img id="stream" src="/stream.mjpg" alt="live tracking stream" />
  </div>
  <dl id="metrics">
    <div><dt>Face</dt><dd id="m-face">-</dd></div>
    <div><dt>Error (px)</dt><dd id="m-err">-</dd></div>
    <div><dt>Pan</dt><dd id="m-pan">-</dd></div>
    <div><dt>Tilt</dt><dd id="m-tilt">-</dd></div>
    <div><dt>FPS</dt><dd id="m-fps">-</dd></div>
    <div><dt>Detect</dt><dd id="m-detect">-</dd></div>
    <div><dt>Frame age</dt><dd id="m-age">-</dd></div>
  </dl>
</main>
<script>
  async function poll() {
    try {
      const res = await fetch('/metrics');
      const m = await res.json();
      document.getElementById('status-dot').className = m.age_s < 1.0 ? 'ok' : '';
      document.getElementById('backend').textContent = m.backend;
      document.getElementById('m-face').textContent = m.face_found ? 'tracking' : 'not found';
      document.getElementById('m-err').textContent = `${m.error_x_px.toFixed(0)}, ${m.error_y_px.toFixed(0)}`;
      document.getElementById('m-pan').textContent = `${m.pan_deg.toFixed(1)} deg`;
      document.getElementById('m-tilt').textContent = `${m.tilt_deg.toFixed(1)} deg`;
      document.getElementById('m-fps').textContent = m.fps.toFixed(1);
      document.getElementById('m-detect').textContent = `${m.detect_ms.toFixed(1)} ms`;
      document.getElementById('m-age').textContent = `${m.age_s.toFixed(2)} s`;
    } catch (e) {
      document.getElementById('status-dot').className = '';
    }
  }
  setInterval(poll, 500);
  poll();
</script>
</body>
</html>
