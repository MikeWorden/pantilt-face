[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantilt-face"
version = "0.1.0"
description = "Real-time face-tracking pan-tilt camera on a Raspberry Pi 4 + Pimoroni Pan-Tilt HAT"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
